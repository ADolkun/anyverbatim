[project]
name = "anyverbatim"
version = "0.1.1"
description = "Verified, timestamped transcripts for LLM context from YouTube videos and your own recordings, with local ASR on Apple Silicon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Albert Dolkun" }]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "cn2an>=0.5.24",
    "opencc>=1.4.2",
    "pydantic>=2.14",
    "rapidfuzz>=3.14",
    "yt-dlp[default,curl-cffi]>=2026.10.26",
]

[project.optional-dependencies]
# Exact pins: mlx-audio ships often and engine behaviour changes between releases; bump with a live engine smoke.
asr = ["mlx-audio[stt]==0.6.6"]
# The Whisper control engine; it pulls in torch, so it stays out of the core and the asr extra.
whisper = ["mlx-whisper==0.4.3"]

[project.urls]
Homepage = "https://github.com/ADolkun/anyverbatim"
Repository = "https://github.com/ADolkun/anyverbatim"

[project.scripts]
anyverbatim = "anyverbatim.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy",
    "pyrefly>=1.5.0",
    "pytest>=9.2",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.5",
    "zizmor>=1.32.0",
]
eval = [
    "jiwer>=4.0",
    "pyannote-metrics>=4.2",
    "pyarrow>=26.0.1",
    "whisper-normalizer>=1.0.1",
]
# The correction eval's local candidate behind mlx_lm.server. Exact pin: the eval relies on server details read from
# this release's source (the default_model alias, response_format being ignored).
local-llm = ["mlx-lm==0.32.2"]

[tool.uv]
# CI's setup-uv installs the newest uv that satisfies this.
required-version = ">=0.13.9"
default-groups = ["dev", "eval"]
# MLX only runs on Apple Silicon macOS.
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
# Every rule, so new ruff releases tighten the bar by default. Each opt-out names why it doesn't fit this project.
select = ["ALL"]
ignore = [
    # The formatter owns trailing commas.
    "COM812",
    # The MIT licence lives in LICENSE, not in per-file headers.
    "CPY001",
    # Docstrings only where they add what the signature can't; a required docstring just restates it.
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    # Fail-loud errors carry their actionable message at the raise site; assigning it first only changes tracebacks.
    "EM101",
    "EM102",
    "TRY003",
    # Mandarin text is first-class data here (transcripts, fixtures); the confusable-character checks are noise for it.
    "RUF001",
    "RUF002",
    "RUF003",
    # Every subprocess call passes an argv list; shell=True stays banned by S602 and S604.
    "S603",
    # Python 3.14 evaluates annotations lazily, and pydantic and click read them at runtime, so imports stay real.
    "TC",
]

[tool.ruff.lint.isort]
known-first-party = ["anyverbatim"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 16

[tool.ruff.lint.pylint]
max-args = 10
max-returns = 10
max-branches = 18
max-statements = 80

[tool.ruff.lint.per-file-ignores]
# pytest asserts; fake secrets, temp paths and seeded randomness in fixtures; stand-ins keep the parameter names of what
# they replace; tests call private helpers and take parametrized booleans; tests are not a package.
"tests/**" = ["ARG", "D", "FBT", "INP001", "PLR2004", "S101", "S105", "S106", "S108", "S311", "S607", "SLF001"]
# Command-line tools that print, run outside the package, and carry no complexity budget.
# Eval sampling is seeded for reproducibility, not security.
"evals/**" = ["S311"]
"scripts/**" = ["D", "INP001", "PLR2004", "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "T201"]

[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests", "scripts", "evals"]
python-version = "3.14"
search-path = [".", "scripts", "tests", "tests/acquire", "tests/asr", "tests/diarize"]

[tool.pyrefly.errors]
unannotated-attribute = true
unannotated-return = true
unused-ignore = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "scripts"]
addopts = "-p no:cacheprovider"
strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["anyverbatim"]
branch = true
# sys.monitoring: about a third faster than the C tracer on this suite.
core = "sysmon"

[tool.coverage.report]
fail_under = 96
show_missing = true
skip_covered = true
